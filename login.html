<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Acceso interno · Servicios Integrales</title>
  <style>
    :root{
      --verde:#0f6a3d;
      --verde-oscuro:#0a4f2e;
      --verde-suave:#edf8f2;
      --borde:#d8e9df;
      --texto:#17231d;
      --muted:#66736c;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(180deg,#f4fbf7 0%,#fff 100%);
      color:var(--texto);display:grid;place-items:center;padding:24px;
    }
    .shell{width:min(100%,500px)}
    .brand{
      background:linear-gradient(135deg,var(--verde-oscuro),var(--verde));
      color:#fff;border-radius:20px 20px 0 0;padding:26px 28px;
    }
    .badge{
      display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;
      background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);
      border-radius:999px;padding:7px 10px;margin-bottom:14px;
    }
    h1{margin:0 0 7px;font-size:31px}
    .brand p{margin:0;opacity:.9;font-size:14px}
    .card{
      background:#fff;border:1px solid var(--borde);border-top:0;
      border-radius:0 0 20px 20px;box-shadow:0 18px 45px rgba(20,80,50,.10);
      padding:28px;
    }
    .title{font-size:14px;font-weight:900;margin-bottom:5px}
    .hint{color:var(--muted);font-size:12px;line-height:1.45;margin-bottom:16px}
    .users{display:grid;gap:10px}
    .user-btn{
      width:100%;min-height:58px;border:1px solid var(--borde);border-radius:13px;
      background:#fbfefc;color:var(--texto);padding:11px 14px;cursor:pointer;
      text-align:left;font:inherit;display:flex;align-items:center;
      justify-content:space-between;gap:12px;
    }
    .user-btn:hover{background:var(--verde-suave);border-color:#bcdcca}
    .user-btn strong{display:block;font-size:17px}
    .user-btn span{display:block;margin-top:3px;color:var(--muted);font-size:11px}
    .role{
      flex:none;border-radius:999px;background:var(--verde-suave);
      color:var(--verde-oscuro);padding:6px 9px;font-size:11px;font-weight:900;
    }
    .footer{text-align:center;margin-top:14px;color:#7a877f;font-size:11px}
  </style>
</head>
<body>
  <main class="shell">
    <section class="brand">
      <span class="badge">SERVICIOS INTEGRALES · Uso interno</span>
      <h1>Acceso al sistema</h1>
      <p>Elegí quién está usando esta computadora.</p>
    </section>

    <section class="card">
      <div class="title">Usuario interno</div>
      <div class="hint">La elección queda guardada en esta PC. No se envían correos.</div>

      <div class="users">
        <button class="user-btn" type="button" data-user="KEVIN">
          <div><strong>Kevin</strong><span>Asesor</span></div>
          <div class="role">ASESOR</div>
        </button>

        <button class="user-btn" type="button" data-user="PAMELA">
          <div><strong>Pamela</strong><span>Asesora</span></div>
          <div class="role">ASESOR</div>
        </button>

        <button class="user-btn" type="button" data-user="JUAN">
          <div><strong>Juan</strong><span>Autorizador / Administrador</span></div>
          <div class="role">ADMINISTRADOR</div>
        </button>
      </div>
    </section>

    <div class="footer">SERVICIOS INTEGRALES · Sistema interno</div>
  </main>

  <script src="login.js"></script>
</body>
</html>
